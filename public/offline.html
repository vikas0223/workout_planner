<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#4338ca">
  <title>replyf — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #c7d2fe 0%, #e9d5ff 50%, #c7d2fe 100%);
      color: #312e81;
      padding: 1.5rem;
    }
    .container {
      text-align: center;
      max-width: 420px;
      background: rgba(255,255,255,0.6);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 1rem;
      padding: 2.5rem 2rem;
      box-shadow: 0 8px 32px rgba(67, 56, 202, 0.12);
    }
    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: linear-gradient(135deg, #4338ca, #7c3aed);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon svg {
      width: 32px;
      height: 32px;
      fill: none;
      stroke: white;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.75rem;
    }
    p {
      font-size: 1rem;
      line-height: 1.6;
      color: #4338ca;
      margin-bottom: 0.5rem;
    }
    .safe-msg {
      font-size: 0.875rem;
      color: #6366f1;
      margin-top: 1rem;
      padding: 0.75rem;
      background: rgba(99, 102, 241, 0.08);
      border-radius: 0.5rem;
    }
    .retry-btn {
      display: inline-block;
      margin-top: 1.5rem;
      padding: 0.75rem 1.5rem;
      background: #4338ca;
      color: white;
      font-size: 0.875rem;
      font-weight: 600;
      border: none;
      border-radius: 0.5rem;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }
    .retry-btn:hover { background: #3730a3; }
    .retry-btn:focus-visible { outline: 2px solid #6366f1; outline-offset: 2px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M2 12h4m12 0h4M6 8v8m12-8v8M9 6v12h6V6"/></svg>
    </div>
    <h1>You're Offline</h1>
    <p>This page isn't available offline yet.</p>
    <div class="safe-msg">
      Your workouts are saved on this device. Reconnect to the internet and try again.
    </div>
    <a href="/" class="retry-btn">Try Again</a>
  </div>
</body>
</html>
