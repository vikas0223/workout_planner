<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-grad)"/>
  <circle cx="200" cy="140" r="110" fill="#EEF2FF" opacity="0.6"/>
  <ellipse cx="200" cy="265" rx="140" ry="12" fill="#CBD5E1" opacity="0.4"/>

  <!-- Calf Raise Illustration -->
  <g transform="translate(200, 140)" filter="url(#shadow)">
    <!-- Elevation Step Block -->
    <rect x="-45" y="88" width="90" height="15" rx="2" fill="#334155"/>

    <!-- Head & Upper Body -->
    <circle cx="0" cy="-60" r="14" fill="#1E293B"/>
    <path d="M-18,-45 L-12,25 L12,25 L18,-45 Z" fill="#1E293B"/>

    <!-- Thighs / Upper legs -->
    <path d="M-14,25 L-12,55 L-2,55 L-4,25 Z" fill="#334155"/>
    <path d="M14,25 L12,55 L2,55 L4,25 Z" fill="#334155"/>

    <!-- Calves / Lower Legs (Highlighted Working Muscle: Gastrocnemius / Soleus) -->
    <path d="M-12,55 L-15,80 L-5,80 L-2,55 Z" fill="url(#accent-grad)"/>
    <ellipse cx="-13" cy="65" rx="7" ry="12" fill="url(#accent-grad)"/>

    <path d="M12,55 L15,80 L5,80 L2,55 Z" fill="url(#accent-grad)"/>
    <ellipse cx="13" cy="65" rx="7" ry="12" fill="url(#accent-grad)"/>

    <!-- Feet in Plantarflexion (Heels elevated above balls of feet) -->
    <!-- Left Foot -->
    <path d="M-15,80 L-10,88 L-2,88 L-8,80 Z" fill="#0F172A"/>
    <!-- Right Foot -->
    <path d="M15,80 L10,88 L2,88 L8,80 Z" fill="#0F172A"/>

    <!-- Vertical Extension Vectors -->
    <path d="M-30,75 L-30,50" stroke="#6366F1" stroke-width="3" stroke-dasharray="3,3" fill="none"/>
    <polygon points="-30,45 -35,53 -25,53" fill="#6366F1"/>

    <path d="M30,75 L30,50" stroke="#6366F1" stroke-width="3" stroke-dasharray="3,3" fill="none"/>
    <polygon points="30,45 25,53 35,53" fill="#6366F1"/>
  </g>

  <!-- Anatomical Focus Badge -->
  <g transform="translate(20, 24)">
    <rect width="138" height="24" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="69" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4F46E5" text-anchor="middle">GASTROCNEMIUS</text>
  </g>
</svg>
