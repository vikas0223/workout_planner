<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-grad)"/>
  <circle cx="200" cy="140" r="110" fill="#EEF2FF" opacity="0.6"/>
  <ellipse cx="200" cy="255" rx="140" ry="14" fill="#CBD5E1" opacity="0.4"/>

  <!-- Bench Press Illustration -->
  <g transform="translate(200, 160)" filter="url(#shadow)">
    <!-- Bench Frame -->
    <!-- Legs -->
    <rect x="-80" y="30" width="12" height="60" rx="2" fill="#334155"/>
    <rect x="50" y="30" width="12" height="60" rx="2" fill="#334155"/>
    <rect x="-90" y="85" width="32" height="6" rx="2" fill="#1E293B"/>
    <rect x="40" y="85" width="32" height="6" rx="2" fill="#1E293B"/>
    <!-- Bench Pad -->
    <rect x="-95" y="16" width="160" height="16" rx="4" fill="#0F172A"/>

    <!-- Athlete Body lying on bench -->
    <!-- Head -->
    <circle cx="-80" cy="8" r="13" fill="#1E293B"/>
    <!-- Torso / Chest (Working Muscle Highlighted) -->
    <rect x="-65" y="0" width="60" height="18" rx="6" fill="url(#accent-grad)"/>
    <!-- Hips & Upper Legs -->
    <path d="M-5,10 L30,12 L50,45 L40,50 L24,20 L-5,16 Z" fill="#334155"/>
    <!-- Lower leg to floor -->
    <path d="M48,46 L46,86 L36,86 L38,48 Z" fill="#1E293B"/>
    <!-- Foot on floor -->
    <path d="M34,86 L56,86 L56,92 L32,92 Z" fill="#0F172A"/>

    <!-- Arms pressing barbell -->
    <!-- Shoulders to hands -->
    <path d="M-40,4 L-42,-34 L-40,-52" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-15,4 L-15,-34 L-17,-52" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Triceps highlight -->
    <circle cx="-42" cy="-28" r="6" fill="url(#accent-grad)"/>
    <circle cx="-15" cy="-28" r="6" fill="url(#accent-grad)"/>

    <!-- Barbell -->
    <rect x="-85" y="-56" width="120" height="6" rx="3" fill="#64748B"/>
    <rect x="-82" y="-76" width="8" height="46" rx="2" fill="#334155"/>
    <rect x="26" y="-76" width="8" height="46" rx="2" fill="#334155"/>

    <!-- Motion Vectors (Vertical Press) -->
    <path d="M-28,-22 L-28,-44" stroke="#6366F1" stroke-width="3" stroke-dasharray="3,3" fill="none"/>
    <polygon points="-28,-50 -33,-42 -23,-42" fill="#6366F1"/>
  </g>

  <!-- Anatomical Focus Badge -->
  <g transform="translate(20, 24)">
    <rect width="124" height="24" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="62" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4F46E5" text-anchor="middle">CHEST &amp; TRICEPS</text>
  </g>
</svg>
