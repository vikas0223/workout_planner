<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-grad)"/>
  <circle cx="200" cy="140" r="110" fill="#EEF2FF" opacity="0.6"/>
  <ellipse cx="200" cy="265" rx="140" ry="12" fill="#CBD5E1" opacity="0.4"/>

  <!-- Abductor Machine Illustration -->
  <g transform="translate(200, 140)" filter="url(#shadow)">
    <!-- Machine Frame & Seat -->
    <!-- Weight Stack in Background -->
    <rect x="-85" y="-30" width="30" height="110" rx="4" fill="#334155"/>
    <line x1="-70" y1="-26" x2="-70" y2="76" stroke="#94A3B8" stroke-width="2"/>
    <rect x="-82" y="-10" width="24" height="60" fill="#475569" stroke="#1E293B" stroke-width="1"/>

    <!-- Machine Seat & Backrest -->
    <rect x="-15" y="-55" width="12" height="75" rx="4" fill="#1E293B"/> <!-- Backrest -->
    <rect x="-25" y="20" width="55" height="12" rx="4" fill="#1E293B"/> <!-- Seat -->
    <rect x="-5" y="32" width="16" height="65" rx="2" fill="#334155"/> <!-- Seat Base -->

    <!-- Athlete Seated (Front/Diagonal View) -->
    <!-- Head -->
    <circle cx="0" cy="-68" r="13" fill="#1E293B"/>
    <!-- Upright Torso resting against backrest -->
    <path d="M-12,-52 L-10,20 L10,20 L12,-52 Z" fill="#334155"/>

    <!-- Left & Right Thighs Spreading Outward (Highlighted Gluteus Medius / Abductors) -->
    <!-- Left Thigh (Abducted outward to left) -->
    <path d="M-10,18 L-55,24 L-50,38 L-6,26 Z" fill="url(#accent-grad)"/>
    <!-- Right Thigh (Abducted outward to right) -->
    <path d="M10,18 L55,24 L50,38 L6,26 Z" fill="url(#accent-grad)"/>

    <!-- Machine Lever Arms & Outer Pads -->
    <rect x="-64" y="16" width="10" height="30" rx="3" fill="#0F172A"/> <!-- Outer Pad Left -->
    <rect x="54" y="16" width="10" height="30" rx="3" fill="#0F172A"/> <!-- Outer Pad Right -->
    <path d="M-59,46 L-40,85" stroke="#64748B" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M59,46 L40,85" stroke="#64748B" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Lower Legs & Footrests -->
    <path d="M-50,38 L-44,85 L-34,85 L-40,38 Z" fill="#1E293B"/>
    <path d="M50,38 L44,85 L34,85 L40,38 Z" fill="#1E293B"/>
    <rect x="-52" y="85" width="22" height="6" rx="2" fill="#64748B"/>
    <rect x="30" y="85" width="22" height="6" rx="2" fill="#64748B"/>

    <!-- Outward Abduction Motion Vectors -->
    <path d="M-30,6 L-62,10" stroke="#6366F1" stroke-width="3" stroke-dasharray="3,3" fill="none"/>
    <polygon points="-68,11 -58,6 -60,16" fill="#6366F1"/>

    <path d="M30,6 L62,10" stroke="#6366F1" stroke-width="3" stroke-dasharray="3,3" fill="none"/>
    <polygon points="68,11 60,16 58,6" fill="#6366F1"/>
  </g>

  <!-- Anatomical Focus Badge -->
  <g transform="translate(20, 24)">
    <rect width="138" height="24" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="69" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4F46E5" text-anchor="middle">GLUTES &amp; ABDUCTORS</text>
  </g>
</svg>
