<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-grad)"/>
  <circle cx="200" cy="140" r="110" fill="#EEF2FF" opacity="0.6"/>
  <ellipse cx="200" cy="265" rx="140" ry="12" fill="#CBD5E1" opacity="0.4"/>

  <!-- Lat Pulldown Machine Illustration -->
  <g transform="translate(200, 135)" filter="url(#shadow)">
    <!-- Pulley Frame & Cable Top -->
    <rect x="-8" y="-115" width="16" height="35" fill="#334155"/>
    <circle cx="0" cy="-80" r="10" fill="#64748B"/>
    <!-- Cable -->
    <line x1="0" y1="-80" x2="0" y2="-55" stroke="#475569" stroke-width="3"/>
    <!-- Wide Grip Lat Bar -->
    <path d="M-85,-45 L-70,-55 L70,-55 L85,-45" stroke="#1E293B" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Seated Athlete -->
    <circle cx="0" cy="-35" r="14" fill="#1E293B"/> <!-- Head -->

    <!-- V-Taper Lats (Working Muscle Highlighted) -->
    <path d="M-30,-20 L-14,35 L14,35 L30,-20 Z" fill="url(#accent-grad)"/>
    <path d="M-26,-15 Q-32,5 -10,30 Q0,10 0,-18 Z" fill="#4F46E5" opacity="0.7"/>
    <path d="M26,-15 Q32,5 10,30 Q0,10 0,-18 Z" fill="#4F46E5" opacity="0.7"/>

    <!-- Arms pulling down -->
    <path d="M-24,-18 L-55,-35 L-75,-48" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M24,-18 L55,-35 L75,-48" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Seat & Thigh Pad -->
    <rect x="-25" y="32" width="50" height="12" rx="3" fill="#1E293B"/> <!-- Seat -->
    <rect x="-28" y="16" width="56" height="8" rx="2" fill="#334155"/> <!-- Thigh Pad Lock -->

    <!-- Downward Pull Vectors -->
    <path d="M-65,-30 L-65,-6" stroke="#6366F1" stroke-width="3" stroke-dasharray="3,3" fill="none"/>
    <polygon points="-65,0 -70,-8 -60,-8" fill="#6366F1"/>

    <path d="M65,-30 L65,-6" stroke="#6366F1" stroke-width="3" stroke-dasharray="3,3" fill="none"/>
    <polygon points="65,0 60,-8 70,-8" fill="#6366F1"/>
  </g>

  <!-- Anatomical Focus Badge -->
  <g transform="translate(20, 24)">
    <rect width="138" height="24" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="69" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4F46E5" text-anchor="middle">LATISSIMUS DORSI</text>
  </g>
</svg>
