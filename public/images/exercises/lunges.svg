<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-grad)"/>
  <circle cx="200" cy="140" r="110" fill="#EEF2FF" opacity="0.6"/>
  <ellipse cx="200" cy="265" rx="140" ry="12" fill="#CBD5E1" opacity="0.4"/>

  <!-- Lunges Illustration -->
  <g transform="translate(200, 155)" filter="url(#shadow)">
    <!-- Athlete in Split Stance Lunge (90/90 degree knee angles) -->
    <!-- Head -->
    <circle cx="-10" cy="-66" r="14" fill="#1E293B"/>
    <!-- Upright Torso -->
    <path d="M-18,-50 L-14,10 L10,10 L6,-50 Z" fill="#1E293B"/>

    <!-- Arms on Hips / Balanced at Side -->
    <path d="M-16,-40 L-34,-15 L-12,-2" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M8,-40 L26,-15 L10,-2" stroke="#334155" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Front Leg (Left) - Thigh Horizontal (Highlighted Working Muscle) -->
    <path d="M-12,10 L35,12 L32,26 L-10,22 Z" fill="url(#accent-grad)"/>
    <!-- Front Knee to Floor (Vertical Shin) -->
    <path d="M35,16 L35,76 L24,76 L24,18 Z" fill="#334155"/>
    <!-- Front Foot flat on floor -->
    <path d="M22,76 L52,76 L52,84 L18,84 Z" fill="#0F172A"/>

    <!-- Back Leg (Right) - Hip Extension down to hovering knee -->
    <path d="M-12,10 L-45,35 L-35,40 L-6,14 Z" fill="url(#accent-grad)"/>
    <!-- Back Shin horizontal back to toes -->
    <path d="M-45,38 L-75,76 L-65,80 L-35,42 Z" fill="#334155"/>
    <!-- Back Foot on Ball of Toes -->
    <path d="M-82,78 L-64,78 L-64,84 L-86,84 Z" fill="#0F172A"/>

    <!-- Kinetic Vertical Elevation Arrow -->
    <path d="M-5,-10 L-5,-38" stroke="#6366F1" stroke-width="3" stroke-dasharray="3,3" fill="none"/>
    <polygon points="-5,-44 -10,-36 0,-36" fill="#6366F1"/>
  </g>

  <!-- Anatomical Focus Badge -->
  <g transform="translate(20, 24)">
    <rect width="128" height="24" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="64" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4F46E5" text-anchor="middle">QUADS &amp; GLUTES</text>
  </g>
</svg>
