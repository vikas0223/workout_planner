<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-grad)"/>
  <circle cx="200" cy="140" r="110" fill="#EEF2FF" opacity="0.6"/>
  <ellipse cx="200" cy="265" rx="140" ry="12" fill="#CBD5E1" opacity="0.4"/>

  <!-- Ankle Rotations Illustration -->
  <g transform="translate(200, 140)" filter="url(#shadow)">
    <!-- Lower Leg / Shin (Tibia & Fibula) positioned diagonally -->
    <path d="M-60,-75 L-20,10 L-6,4 L-46,-81 Z" fill="#334155"/>
    
    <!-- Calf & Tibialis Muscles Highlighted -->
    <path d="M-58,-70 L-22,6 L-12,0 L-48,-76 Z" fill="url(#accent-grad)" opacity="0.85"/>

    <!-- Ankle Joint Center Pivot / Axis -->
    <circle cx="-12" cy="12" r="12" fill="#1E293B"/>
    <circle cx="-12" cy="12" r="5" fill="#6366F1"/>

    <!-- Foot in Dynamic Point/Flex Rotation -->
    <!-- Heel -->
    <ellipse cx="-22" cy="18" rx="9" ry="8" fill="#1E293B"/>
    <!-- Midfoot & Arch -->
    <path d="M-18,22 L18,34 L22,48 L-14,32 Z" fill="#1E293B"/>
    <!-- Forefoot & Toes pointing forward-down in rotation -->
    <path d="M16,34 L46,42 L42,54 L18,46 Z" fill="#0F172A"/>

    <!-- 360-Degree Circular Kinetic Rotation Arc -->
    <path d="M 40,0 A 42,42 0 1,1 0,60" fill="none" stroke="#6366F1" stroke-width="3" stroke-dasharray="4,4"/>
    <polygon points="44,-4 38,8 48,6" fill="#6366F1"/>

    <!-- Counter-rotation guide arc -->
    <path d="M-30,48 A 42,42 0 0,1 30,10" fill="none" stroke="#818CF8" stroke-width="2" stroke-dasharray="2,3" opacity="0.6"/>
  </g>

  <!-- Anatomical Focus Badge -->
  <g transform="translate(20, 24)">
    <rect width="144" height="24" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="72" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4F46E5" text-anchor="middle">ANKLE JOINT MOBILITY</text>
  </g>
</svg>
