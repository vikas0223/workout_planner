<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-grad)"/>
  <circle cx="200" cy="140" r="110" fill="#EEF2FF" opacity="0.6"/>
  <ellipse cx="200" cy="265" rx="140" ry="12" fill="#CBD5E1" opacity="0.4"/>

  <!-- Assault / Air Bike Illustration -->
  <g transform="translate(200, 140)" filter="url(#shadow)">
    <!-- Front Fan Wheel Cage -->
    <circle cx="55" cy="40" r="45" fill="none" stroke="#334155" stroke-width="4"/>
    <circle cx="55" cy="40" r="8" fill="#475569"/>
    <!-- Fan Blades -->
    <line x1="55" y1="5" x2="55" y2="75" stroke="#94A3B8" stroke-width="2"/>
    <line x1="20" y1="40" x2="90" y2="40" stroke="#94A3B8" stroke-width="2"/>
    <line x1="30" y1="15" x2="80" y2="65" stroke="#94A3B8" stroke-width="2"/>
    <line x1="30" y1="65" x2="80" y2="15" stroke="#94A3B8" stroke-width="2"/>

    <!-- Bike Frame Structure -->
    <!-- Base stabilizers -->
    <rect x="-85" y="80" width="40" height="8" rx="2" fill="#1E293B"/>
    <rect x="35" y="80" width="40" height="8" rx="2" fill="#1E293B"/>
    <!-- Bottom Main Tube -->
    <path d="M-65,80 L-10,45 L55,40" stroke="#1E293B" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Seat Post Tube -->
    <path d="M-10,45 L-45,-10" stroke="#1E293B" stroke-width="7" stroke-linecap="round" fill="none"/>
    <rect x="-60" y="-15" width="28" height="8" rx="3" fill="#0F172A"/> <!-- Seat Saddle -->

    <!-- Dual Action Moving Arms -->
    <path d="M5,42 L25,-45" stroke="#475569" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="25" cy="-45" r="4" fill="#6366F1"/> <!-- Handle Grip -->
    <path d="M-5,42 L15,-38" stroke="#334155" stroke-width="5" stroke-linecap="round" fill="none"/>
    <circle cx="15" cy="-38" r="4" fill="#4F46E5"/>

    <!-- Rider Figure (Side View) -->
    <!-- Head -->
    <circle cx="-15" cy="-60" r="12" fill="#1E293B"/>
    <!-- Torso angled slightly forward -->
    <path d="M-40,-10 L-20,-50 L-8,-48 L-30,-8 Z" fill="#334155"/>
    <!-- Arms reaching to moving handles -->
    <path d="M-14,-46 L8,-43 L23,-44" stroke="#334155" stroke-width="5" stroke-linecap="round" fill="none"/>
    <!-- Legs cycling (Active Quads & Glutes) -->
    <!-- Right Leg pedaling down -->
    <path d="M-35,-8 L-15,15 L-5,45" stroke="url(#accent-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Left Leg coming up -->
    <path d="M-35,-8 L-20,-2 L-10,25" stroke="#1E293B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Drive Crank & Pedal -->
    <circle cx="-10" cy="45" r="10" fill="#64748B"/>
    <line x1="-10" y1="45" x2="-5" y2="55" stroke="#0F172A" stroke-width="4"/>
    <rect x="-10" y="55" width="10" height="4" fill="#1E293B"/>

    <!-- Dynamic Motion Cue -->
    <path d="M85,15 A45,45 0 0,1 95,65" fill="none" stroke="#6366F1" stroke-width="3" stroke-dasharray="4,4"/>
  </g>
</svg>
