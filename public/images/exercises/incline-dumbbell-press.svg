<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-grad)"/>
  <circle cx="200" cy="140" r="110" fill="#EEF2FF" opacity="0.6"/>
  <ellipse cx="200" cy="265" rx="140" ry="12" fill="#CBD5E1" opacity="0.4"/>

  <!-- Incline Dumbbell Press Illustration -->
  <g transform="translate(200, 150)" filter="url(#shadow)">
    <!-- Incline Bench Frame (45 deg angle) -->
    <!-- Base -->
    <rect x="-80" y="70" width="130" height="12" rx="3" fill="#334155"/>
    <rect x="-70" y="40" width="12" height="35" rx="2" fill="#1E293B"/>
    <!-- Seat -->
    <rect x="-30" y="55" width="40" height="12" rx="3" fill="#0F172A"/>
    <!-- Angled Backrest -->
    <path d="M-25,58 L-80,-20 L-68,-28 L-15,50 Z" fill="#0F172A"/>
    <line x1="-50" y1="12" x2="-20" y2="70" stroke="#64748B" stroke-width="6" stroke-linecap="round"/>

    <!-- Athlete Body seated on 45 deg incline -->
    <!-- Head -->
    <circle cx="-82" cy="-36" r="13" fill="#1E293B"/>
    <!-- Torso along incline (Working Upper Chest Highlighted) -->
    <path d="M-66,-22 L-16,42 L2,32 L-48,-32 Z" fill="url(#accent-grad)"/>
    <!-- Thighs / Legs -->
    <path d="M-12,48 L35,46 L50,85 L38,85 L26,58 L-12,58 Z" fill="#334155"/>
    <!-- Foot on floor -->
    <rect x="36" y="85" width="24" height="7" rx="2" fill="#0F172A"/>

    <!-- Arms pressing upward -->
    <path d="M-36,-14 L-28,-50 L-22,-70" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M-10,-4 L-2,-40 L4,-60" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <!-- Anterior Deltoid & Clavicular Chest Highlight -->
    <circle cx="-38" cy="-14" r="7" fill="url(#accent-grad)"/>

    <!-- Dumbbell 1 -->
    <g transform="translate(-22, -72)">
      <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#94A3B8"/>
      <rect x="-16" y="-10" width="6" height="20" rx="2" fill="#1E293B"/>
      <rect x="10" y="-10" width="6" height="20" rx="2" fill="#1E293B"/>
    </g>

    <!-- Dumbbell 2 -->
    <g transform="translate(4, -62)">
      <rect x="-12" y="-3" width="24" height="6" rx="2" fill="#94A3B8"/>
      <rect x="-16" y="-10" width="6" height="20" rx="2" fill="#1E293B"/>
      <rect x="10" y="-10" width="6" height="20" rx="2" fill="#1E293B"/>
    </g>

    <!-- Motion Vector (Incline Upward Press) -->
    <path d="M-10,-24 L-2,-44" stroke="#6366F1" stroke-width="3" stroke-dasharray="3,3" fill="none"/>
    <polygon points="-2,-50 -7,-42 3,-42" fill="#6366F1"/>
  </g>

  <!-- Anatomical Focus Badge -->
  <g transform="translate(20, 24)">
    <rect width="146" height="24" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="73" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4F46E5" text-anchor="middle">UPPER CHEST &amp; DELTS</text>
  </g>
</svg>
