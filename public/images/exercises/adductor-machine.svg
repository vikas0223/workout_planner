<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-grad)"/>
  <circle cx="200" cy="140" r="110" fill="#EEF2FF" opacity="0.6"/>
  <ellipse cx="200" cy="265" rx="140" ry="12" fill="#CBD5E1" opacity="0.4"/>

  <!-- Adductor Machine Illustration -->
  <g transform="translate(200, 140)" filter="url(#shadow)">
    <!-- Machine Frame & Seat -->
    <!-- Weight Stack in Background -->
    <rect x="-85" y="-30" width="30" height="110" rx="4" fill="#334155"/>
    <line x1="-70" y1="-26" x2="-70" y2="76" stroke="#94A3B8" stroke-width="2"/>
    <rect x="-82" y="-10" width="24" height="60" fill="#475569" stroke="#1E293B" stroke-width="1"/>

    <!-- Machine Seat & Backrest -->
    <rect x="-15" y="-55" width="12" height="75" rx="4" fill="#1E293B"/>
    <rect x="-25" y="20" width="55" height="12" rx="4" fill="#1E293B"/>
    <rect x="-5" y="32" width="16" height="65" rx="2" fill="#334155"/>

    <!-- Athlete Seated -->
    <circle cx="0" cy="-68" r="13" fill="#1E293B"/>
    <path d="M-12,-52 L-10,20 L10,20 L12,-52 Z" fill="#334155"/>

    <!-- Left & Right Thighs Squeezing Inward (Highlighted Inner Thighs / Adductors) -->
    <!-- Left Thigh -->
    <path d="M-12,18 L-35,22 L-30,36 L-6,26 Z" fill="url(#accent-grad)"/>
    <!-- Right Thigh -->
    <path d="M12,18 L35,22 L30,36 L6,26 Z" fill="url(#accent-grad)"/>

    <!-- Machine Lever Arms & Inner Pads -->
    <rect x="-26" y="16" width="10" height="28" rx="3" fill="#0F172A"/> <!-- Inner Pad Left -->
    <rect x="16" y="16" width="10" height="28" rx="3" fill="#0F172A"/> <!-- Inner Pad Right -->
    <path d="M-21,44 L-32,85" stroke="#64748B" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M21,44 L32,85" stroke="#64748B" stroke-width="6" stroke-linecap="round" fill="none"/>

    <!-- Lower Legs & Footrests -->
    <path d="M-30,36 L-32,85 L-22,85 L-22,36 Z" fill="#1E293B"/>
    <path d="M30,36 L32,85 L22,85 L22,36 Z" fill="#1E293B"/>
    <rect x="-38" y="85" width="20" height="6" rx="2" fill="#64748B"/>
    <rect x="18" y="85" width="20" height="6" rx="2" fill="#64748B"/>

    <!-- Inward Adduction Motion Vectors -->
    <path d="M-55,8 L-32,12" stroke="#6366F1" stroke-width="3" stroke-dasharray="3,3" fill="none"/>
    <polygon points="-26,13 -35,8 -34,18" fill="#6366F1"/>

    <path d="M55,8 L32,12" stroke="#6366F1" stroke-width="3" stroke-dasharray="3,3" fill="none"/>
    <polygon points="26,13 34,18 35,8" fill="#6366F1"/>
  </g>

  <!-- Anatomical Focus Badge -->
  <g transform="translate(20, 24)">
    <rect width="138" height="24" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="69" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4F46E5" text-anchor="middle">INNER THIGHS &amp; GROIN</text>
  </g>
</svg>
