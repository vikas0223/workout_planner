<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-grad)"/>
  <circle cx="200" cy="140" r="110" fill="#EEF2FF" opacity="0.6"/>
  <ellipse cx="200" cy="265" rx="140" ry="12" fill="#CBD5E1" opacity="0.4"/>

  <!-- Romanian Deadlift (RDL) Illustration -->
  <g transform="translate(200, 150)" filter="url(#shadow)">
    <!-- Athlete in Hinge Position, Barbell at Knee Height -->
    <!-- Head -->
    <circle cx="-25" cy="-60" r="13" fill="#1E293B"/>
    <!-- Spine / Torso neutral at 40 deg -->
    <path d="M-18,-50 L-50,-10 L-32,-2 L-4,-40 Z" fill="#1E293B"/>

    <!-- Hamstrings & Glutes (Primary Working Muscle Highlighted) -->
    <ellipse cx="-44" cy="-4" rx="20" ry="14" fill="url(#accent-grad)"/>
    <path d="M-44,-2 L-22,35 L-12,30 L-30,-8 Z" fill="url(#accent-grad)"/>

    <!-- Soft Knees / Lower Legs -->
    <path d="M-22,35 L-18,85 L-6,85 L-10,35 Z" fill="#334155"/>
    <path d="M-22,85 L6,85 L10,93 L-26,93 Z" fill="#0F172A"/>

    <!-- Arms hanging vertically with Barbell at patella/knee height -->
    <path d="M-10,-42 L-6,28" stroke="#334155" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Barbell -->
    <rect x="-60" y="24" width="120" height="6" rx="3" fill="#64748B"/>
    <circle cx="-6" cy="27" r="22" fill="#1E293B" stroke="#475569" stroke-width="3"/>
    <circle cx="-6" cy="27" r="8" fill="#64748B"/>

    <!-- Posterior Hip Shift Vector -->
    <path d="M-25,-12 L-55,-12" stroke="#6366F1" stroke-width="3" stroke-dasharray="3,3" fill="none"/>
    <polygon points="-60,-12 -52,-17 -52,-7" fill="#6366F1"/>
  </g>

  <!-- Anatomical Focus Badge -->
  <g transform="translate(20, 24)">
    <rect width="138" height="24" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="69" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4F46E5" text-anchor="middle">POSTERIOR CHAIN</text>
  </g>
</svg>
