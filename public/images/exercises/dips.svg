<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="400" height="300" rx="16" fill="url(#bg-grad)"/>
  <circle cx="200" cy="140" r="110" fill="#EEF2FF" opacity="0.6"/>
  <ellipse cx="200" cy="270" rx="140" ry="12" fill="#CBD5E1" opacity="0.4"/>

  <!-- Dips Illustration -->
  <g transform="translate(200, 140)" filter="url(#shadow)">
    <!-- Dip Bars Station -->
    <rect x="-80" y="-10" width="8" height="130" fill="#334155"/>
    <rect x="72" y="-10" width="8" height="130" fill="#334155"/>
    <!-- Parallel Hand Grip Bars -->
    <rect x="-95" y="-14" width="38" height="10" rx="4" fill="#64748B"/>
    <rect x="57" y="-14" width="38" height="10" rx="4" fill="#64748B"/>

    <!-- Athlete Suspended Between Bars -->
    <!-- Head -->
    <circle cx="0" cy="-60" r="14" fill="#1E293B"/>

    <!-- Chest & Triceps (Highlighted Working Muscles) -->
    <!-- Torso tilted slightly forward -->
    <path d="M-22,-44 L-16,15 L16,15 L22,-44 Z" fill="url(#accent-grad)"/>

    <!-- Arms on Bars at 90 degree flexion -->
    <path d="M-20,-40 L-45,-26 L-72,-10" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="-45" cy="-26" r="6" fill="url(#accent-grad)"/> <!-- Tricep highlight -->

    <path d="M20,-40 L45,-26 L72,-10" stroke="#334155" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="45" cy="-26" r="6" fill="url(#accent-grad)"/> <!-- Tricep highlight -->

    <!-- Hips & Bent Knees hanging -->
    <path d="M-14,15 L-14,50 L-32,70 L-26,75 L-6,54 L-6,15 Z" fill="#334155"/>
    <path d="M14,15 L14,50 L-4,70 L2,75 L22,54 L22,15 Z" fill="#1E293B"/>
    <!-- Crossed Feet -->
    <ellipse cx="-18" cy="74" rx="8" ry="5" fill="#0F172A"/>

    <!-- Drive Vectors (Push Up) -->
    <path d="M-55,20 L-55,-6" stroke="#6366F1" stroke-width="3" stroke-dasharray="3,3" fill="none"/>
    <polygon points="-55,-12 -60,-4 -50,-4" fill="#6366F1"/>

    <path d="M55,20 L55,-6" stroke="#6366F1" stroke-width="3" stroke-dasharray="3,3" fill="none"/>
    <polygon points="55,-12 50,-4 60,-4" fill="#6366F1"/>
  </g>

  <!-- Anatomical Focus Badge -->
  <g transform="translate(20, 24)">
    <rect width="138" height="24" rx="6" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="69" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600" fill="#4F46E5" text-anchor="middle">TRICEPS &amp; CHEST</text>
  </g>
</svg>
